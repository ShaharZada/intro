<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>בואו תכירו אותי — כרטיס היכרות אינטראקטיבי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;600;700&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
/* ============ Design tokens ============ */
:root {
  --bg-1: #FAF7F2;
  --bg-2: #F0E9DF;
  --sage: #A8B5A0;
  --sage-soft: #C8D2BF;
  --peach: #E8C5B4;
  --gold: #D4BFA5;
  --gold-deep: #B59E7E;
  --ink: #3A3A3A;
  --ink-2: #7A7A7A;
  --ink-3: #A39E96;
  --rose: #C8A4A0;
  --sky: #BCD0DC;
  --paper-line: rgba(58,58,58,0.06);
  --shadow-soft: 0 8px 32px rgba(168, 181, 160, 0.18);
  --shadow-card: 0 18px 60px -20px rgba(58, 58, 58, 0.18), 0 2px 8px rgba(58,58,58,0.04);
  --shadow-pop: 0 12px 40px rgba(0,0,0,0.08);
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; }
html, body, #root {
  margin: 0; padding: 0;
  min-height: 100vh;
  background: var(--bg-1);
  color: var(--ink);
  font-family: "Assistant", "Heebo", system-ui, sans-serif;
  font-weight: 400;
  direction: rtl;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.serif { font-family: "Frank Ruhl Libre", "Playfair Display", Georgia, serif; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
:focus-visible { outline: 2px dashed var(--sage); outline-offset: 3px; border-radius: 6px; }

.paper-bg {
  background-color: var(--bg-1);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(212,191,165,0.10), transparent 35%),
    radial-gradient(circle at 88% 82%, rgba(168,181,160,0.10), transparent 40%),
    repeating-linear-gradient(0deg, transparent 0 28px, var(--paper-line) 28px 29px);
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow-x: hidden;
}

/* ============ Top bar ============ */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 36px;
  gap: 24px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--ink);
}
.brand-mark {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--sage), var(--gold));
  position: relative;
  box-shadow: inset 0 0 0 3px var(--bg-1), 0 4px 10px rgba(168,181,160,0.3);
}
.brand-name { font-family: "Frank Ruhl Libre", serif; font-size: 18px; letter-spacing: 0.02em; }
.brand-name small { display: block; font-family: "Assistant", sans-serif; font-size: 11px; color: var(--ink-2); letter-spacing: 0.18em; text-transform: uppercase; }

.progress-dots {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink-2);
  font-size: 13px;
}
.progress-dots .dots { display: flex; gap: 8px; }
.progress-dots .dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1.4px solid var(--gold);
  background: transparent;
  transition: all .4s var(--ease);
}
.progress-dots .dot.done {
  background: var(--sage);
  border-color: var(--sage);
  transform: scale(1.05);
  box-shadow: 0 0 0 4px rgba(168,181,160,0.18);
}

/* ============ Screen 1: opening card ============ */
.screen-1 {
  flex: 1;
  display: grid;
  place-items: center;
  padding: 40px 24px 60px;
}
.bizcard {
  width: min(720px, 92vw);
  aspect-ratio: 1.62 / 1;
  background: #fff;
  border-radius: 22px;
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
  padding: 44px 48px;
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto 1fr auto;
  gap: 18px 28px;
  align-items: start;
  animation: cardIn .85s var(--ease) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}
.bizcard::before {
  content: "";
  position: absolute;
  inset: 14px;
  border: 1px solid var(--gold);
  border-radius: 14px;
  pointer-events: none;
  opacity: 0.5;
}
.bizcard::after {
  content: "";
  position: absolute;
  top: -120px; left: -120px;
  width: 280px; height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(168,181,160,0.25), transparent 70%);
}
.bizcard .avatar {
  grid-row: 1 / 2;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: linear-gradient(160deg, var(--bg-2), #fff);
  box-shadow: inset 0 0 0 3px var(--gold), 0 8px 24px rgba(212,191,165,0.4);
  display: grid; place-items: center;
  position: relative;
  z-index: 1;
  animation: fadeUp 1s .15s var(--ease) both;
}
.bizcard .avatar svg { width: 78%; height: 78%; }
.bizcard .meta {
  grid-row: 1 / 2;
  align-self: end;
  animation: fadeUp 1s .3s var(--ease) both;
}
.bizcard .meta .eyebrow { font-size: 12px; letter-spacing: 0.28em; color: var(--sage); text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.bizcard .meta .eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--gold); }
.bizcard .meta h1 { font-family: "Frank Ruhl Libre", serif; font-size: clamp(34px, 4.4vw, 52px); margin: 0 0 6px; font-weight: 600; line-height: 1.05; }
.bizcard .meta .name { font-family: "Frank Ruhl Libre", serif; font-size: 22px; color: var(--ink); margin-top: 14px; }
.bizcard .meta .role { font-size: 14px; color: var(--ink-2); letter-spacing: 0.06em; }
.bizcard .tagline {
  grid-column: 1 / 3;
  grid-row: 2 / 3;
  font-size: 16px;
  color: var(--ink-2);
  line-height: 1.7;
  max-width: 56ch;
  animation: fadeUp 1s .45s var(--ease) both;
}
.bizcard .cta-row {
  grid-column: 1 / 3;
  grid-row: 3 / 4;
  display: flex;
  justify-content: space-between;
  align-items: end;
  animation: fadeUp 1s .6s var(--ease) both;
}
.bizcard .cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 14px 26px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--bg-1);
  font-size: 15px;
  letter-spacing: 0.04em;
  transition: all .35s var(--ease);
  box-shadow: 0 8px 24px -8px rgba(58,58,58,0.4);
}
.bizcard .cta:hover { transform: translateY(-2px); background: #2a2a2a; }
.bizcard .cta .arr { transition: transform .35s var(--ease); }
.bizcard .cta:hover .arr { transform: translateX(-6px); }
.bizcard .footnote { font-size: 11px; letter-spacing: 0.24em; color: var(--ink-3); text-transform: uppercase; }
.bizcard .corner-mark { position: absolute; bottom: 28px; left: 32px; font-family: "Frank Ruhl Libre", serif; font-style: italic; color: var(--gold-deep); font-size: 13px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

/* ============ Screen 2: dressing room ============ */
.screen-2 {
  flex: 1;
  display: grid;
  grid-template-columns: 280px 1fr 360px;
  gap: 28px;
  padding: 8px 36px 40px;
  align-items: stretch;
}

.panel {
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(8px);
  border-radius: 22px;
  padding: 24px;
  border: 1px solid rgba(212,191,165,0.35);
  box-shadow: var(--shadow-soft);
}
.panel-title { font-family: "Frank Ruhl Libre", serif; font-size: 20px; margin: 0 0 4px; font-weight: 600; }
.panel-sub { color: var(--ink-2); font-size: 12.5px; margin: 0 0 18px; letter-spacing: 0.04em; }

.wardrobe-list { display: flex; flex-direction: column; gap: 12px; list-style: none; margin: 0; padding: 0; }
.wardrobe-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: #fff;
  border: 1px solid rgba(212,191,165,0.45);
  border-radius: 16px;
  cursor: grab;
  transition: all .35s var(--ease);
  position: relative;
}
.wardrobe-item:hover { transform: translateY(-4px); box-shadow: 0 10px 24px -10px rgba(168,181,160,0.45); border-color: var(--sage); }
.wardrobe-item.placed { opacity: 0.5; filter: grayscale(.4); cursor: default; }
.wardrobe-item.placed::after { content: "✓"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--sage); font-size: 16px; }
.wardrobe-item.dragging { opacity: 0.55; cursor: grabbing; transform: scale(1.05); }

.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 10000;
  transform: translate(-50%, -50%) rotate(-4deg);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px 10px 12px;
  background: #fff;
  border: 1px solid var(--gold);
  border-radius: 14px;
  box-shadow: 0 12px 36px -8px rgba(58,58,58,0.35);
  font-family: "Frank Ruhl Libre", serif;
  font-size: 15px;
  color: var(--ink);
}
.drag-ghost .ic {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--bg-2);
  display: grid; place-items: center;
}
.wardrobe-item .ic {
  width: 46px; height: 46px;
  flex: 0 0 46px;
  border-radius: 12px;
  background: var(--bg-2);
  display: grid; place-items: center;
  color: var(--ink);
}
.wardrobe-item .lbl { display: flex; flex-direction: column; }
.wardrobe-item .lbl strong { font-family: "Frank Ruhl Libre", serif; font-weight: 500; font-size: 16px; }
.wardrobe-item .lbl small { font-size: 11.5px; color: var(--ink-2); letter-spacing: 0.06em; }

.stage {
  position: relative;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at center 65%, rgba(212,191,165,0.20), transparent 60%),
    rgba(255,255,255,0.4);
  border-radius: 28px;
  border: 1px solid rgba(212,191,165,0.35);
  padding: 24px 12px;
  overflow: hidden;
  min-height: 640px;
}
.stage::before, .stage::after {
  content: ""; position: absolute; inset: auto; pointer-events: none;
}
.stage::before {
  top: 32px; right: 32px; width: 90px; height: 90px;
  border: 1px solid var(--gold); border-radius: 50%; opacity: 0.4;
}
.stage::after {
  bottom: 24px; left: 24px;
  font-family: "Frank Ruhl Libre", serif; font-style: italic; font-size: 13px;
  color: var(--gold-deep); opacity: 0.65;
  content: "— הדמות —";
}
.character-wrap {
  position: relative;
  width: 400px;
  height: 650px;
  max-width: 100%;
  max-height: 100%;
}
.character-svg { width: 100%; height: 100%; display: block; }

.dropzone {
  position: absolute;
  border: 1.5px dashed var(--ink-3);
  border-radius: 14px;
  opacity: 0;
  transition: all .35s var(--ease);
  pointer-events: none;
  background: rgba(255,255,255,0.0);
}
.dragging-active .dropzone { opacity: 0.6; border-color: var(--sage); }
.dropzone.hover {
  opacity: 1;
  border-color: var(--sage);
  background: rgba(168,181,160,0.15);
  animation: pulse 1.4s var(--ease) infinite;
}
.dropzone.wrong-hover {
  opacity: 1;
  border-color: var(--peach);
  background: rgba(232,197,180,0.18);
  animation: shake .35s var(--ease);
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(168,181,160,0.25); }
  50% { box-shadow: 0 0 0 12px rgba(168,181,160,0); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.placed-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.placed-piece {
  position: absolute;
  animation: drape .6s var(--ease) both;
}
@keyframes drape {
  0% { opacity: 0; transform: translateY(-20px) scale(0.9); }
  60% { opacity: 1; transform: translateY(4px) scale(1.02); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.sparkle {
  position: absolute;
  pointer-events: none;
  width: 90px; height: 90px;
  transform: translate(-50%, -50%);
}
.sparkle span {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold);
  animation: spark 0.9s var(--ease) forwards;
}
@keyframes spark {
  0% { transform: translate(0,0) scale(0); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
}

.popup-col { display: flex; flex-direction: column; gap: 16px; }
.popup-empty {
  flex: 1;
  display: grid; place-items: center;
  text-align: center;
  border-radius: 22px;
  border: 1.5px dashed var(--gold);
  background: rgba(255,255,255,0.35);
  padding: 28px;
  color: var(--ink-3);
}
.popup-empty .hint { font-family: "Frank Ruhl Libre", serif; font-size: 20px; color: var(--gold-deep); margin-top: 12px; }
.popup-empty small { display: block; margin-top: 4px; font-size: 12px; letter-spacing: 0.12em; }

.popup {
  background: rgba(255,255,255,0.96);
  border-radius: 22px;
  padding: 28px;
  box-shadow: var(--shadow-pop);
  border: 1px solid rgba(212,191,165,0.35);
  animation: popIn .45s var(--ease) both;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.popup .icon-circle {
  width: 60px; height: 60px;
  border-radius: 50%;
  display: grid; place-items: center;
  margin-bottom: 14px;
}
.popup .eyebrow { font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; margin: 0; }
.popup h3 { font-family: "Frank Ruhl Libre", serif; font-size: 24px; margin: 4px 0 14px; font-weight: 600; line-height: 1.2; }
.popup .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 14px 0 16px; }
.popup p.body { font-size: 16px; line-height: 1.75; color: var(--ink); margin: 0; }
.popup .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.popup .tag { font-size: 12px; padding: 5px 12px; border-radius: 999px; background: var(--bg-2); color: var(--ink); letter-spacing: 0.04em; }

.audio-row {
  margin-top: 18px;
  display: flex; align-items: center; gap: 12px;
}
.audio-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--ink); color: var(--bg-1);
  display: grid; place-items: center;
  transition: all .3s var(--ease);
  position: relative;
}
.audio-btn:hover { transform: scale(1.06); }
.audio-btn.playing::before {
  content: ""; position: absolute; inset: -6px;
  border-radius: 50%; border: 1.5px solid var(--sage);
  animation: ring 1.2s var(--ease) infinite;
}
.audio-btn.playing::after {
  content: ""; position: absolute; inset: -14px;
  border-radius: 50%; border: 1px solid var(--sage);
  opacity: 0.4;
  animation: ring 1.2s 0.3s var(--ease) infinite;
}
@keyframes ring {
  0% { transform: scale(0.85); opacity: 0.8; }
  100% { transform: scale(1.25); opacity: 0; }
}
.audio-meta { flex: 1; }
.audio-meta .label { font-size: 13px; color: var(--ink); margin-bottom: 6px; }
.audio-bar {
  height: 4px; border-radius: 4px; background: var(--bg-2); position: relative; overflow: hidden;
}
.audio-bar > i {
  position: absolute; inset: 0 auto 0 0;
  background: linear-gradient(90deg, var(--sage), var(--gold));
  width: 0%;
  transition: width .25s linear;
}
.audio-time { font-size: 11px; color: var(--ink-2); margin-top: 4px; font-variant-numeric: tabular-nums; }

.nav-arrows { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
.nav-arrows button { font-size: 13px; color: var(--ink-2); padding: 6px 10px; border-radius: 8px; transition: all .25s var(--ease); }
.nav-arrows button:hover { color: var(--ink); background: rgba(255,255,255,0.6); }
.nav-arrows button:disabled { opacity: 0.35; cursor: not-allowed; }

/* ============ Screen 4: ending ============ */
.screen-4 {
  flex: 1;
  display: grid;
  place-items: center;
  padding: 24px 24px 80px;
  position: relative;
  overflow: hidden;
}
.ending {
  width: min(820px, 94vw);
  text-align: center;
  position: relative;
  z-index: 2;
}
.final-char {
  width: 360px; height: 540px;
  margin: 0 auto 8px;
  position: relative;
  animation: charIn .9s .2s var(--ease) both;
}
.final-char::before {
  content: "";
  position: absolute;
  inset: -40px;
  background: radial-gradient(circle, rgba(212,191,165,0.45), transparent 65%);
  z-index: -1;
}
@keyframes charIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}
.ending h1 {
  font-family: "Frank Ruhl Libre", serif;
  font-size: clamp(36px, 5vw, 48px);
  margin: 8px 0 14px;
  font-weight: 700;
  color: var(--ink);
  animation: fadeUp .8s .6s var(--ease) both;
}
.ending .sub {
  font-size: 18px;
  color: var(--ink-2);
  line-height: 1.6;
  max-width: 52ch;
  margin: 0 auto 32px;
  animation: fadeUp .8s .9s var(--ease) both;
}
.contact-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 36px;
}
.contact-tile {
  width: 120px; height: 120px;
  background: #fff;
  border: 1px solid var(--gold);
  border-radius: 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
  text-decoration: none;
  color: var(--ink);
  box-shadow: 0 4px 20px rgba(58,58,58,0.04);
  transition: all .4s var(--ease);
  position: relative;
  animation: fadeUp .7s var(--ease) both;
}
.contact-tile:nth-child(1) { animation-delay: 1.2s; }
.contact-tile:nth-child(2) { animation-delay: 1.35s; }
.contact-tile:nth-child(3) { animation-delay: 1.5s; }
.contact-tile:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 36px -12px rgba(58,58,58,0.18);
  border-color: var(--sage);
}
.contact-tile:hover .ctile-ic { transform: scale(1.1); }
.contact-tile:active { transform: translateY(-3px) scale(0.97); }
.contact-tile .ctile-ic {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: grid; place-items: center;
  transition: transform .4s var(--ease);
}
.contact-tile .ctile-label { font-size: 13px; font-weight: 500; }
.contact-tile .ctile-detail { font-size: 10.5px; color: var(--ink-2); letter-spacing: 0.04em; }
.contact-tile .tooltip {
  position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -8px);
  background: var(--ink); color: var(--bg-1);
  padding: 6px 12px; border-radius: 8px;
  font-size: 12px; white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: all .25s var(--ease);
}
.contact-tile:hover .tooltip { opacity: 1; transform: translate(-50%, -14px); }

.restart-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 26px;
  border-radius: 999px;
  border: 1px solid var(--gold);
  color: var(--ink-2);
  font-size: 14px;
  transition: all .35s var(--ease);
  animation: fadeUp .8s 1.8s var(--ease) both;
}
.restart-btn:hover { color: var(--ink); border-color: var(--ink); background: rgba(255,255,255,0.5); }

.footer-extras {
  position: absolute;
  bottom: 24px;
  left: 24px;
  display: flex;
  gap: 14px;
  font-size: 12px;
  color: var(--ink-3);
}
.footer-extras a { color: var(--ink-3); text-decoration: none; padding: 6px 10px; border-radius: 8px; transition: all .25s var(--ease); }
.footer-extras a:hover { color: var(--ink); background: rgba(255,255,255,0.5); }

.confetti-piece {
  position: absolute;
  top: -20px;
  border-radius: 2px;
  animation: fall linear forwards;
  opacity: 0;
}
@keyframes fall {
  0% { transform: translateY(-40px) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ============ Responsive ============ */
@media (max-width: 1180px) {
  .screen-2 { grid-template-columns: 240px 1fr 320px; }
  .character-wrap { width: 320px; height: 520px; }
}
@media (max-width: 960px) {
  .screen-2 { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
  .topbar { padding: 18px 20px; }
  .contact-row { gap: 12px; }
  .contact-tile { width: 100px; height: 100px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;

function DressingRoom({ placed, onPlace, onSelectItem, activeItemId }) {
  const [drag, setDrag] = useState(null);
  const dragRef = useRef(null);
  const [hoverZone, setHoverZone] = useState(null);
  const [sparkleAt, setSparkleAt] = useState(null);
  const charWrapRef = useRef(null);

  const hitTest = (pageX, pageY) => {
    const wrap = charWrapRef.current;
    if (!wrap) return null;
    const r = wrap.getBoundingClientRect();
    const x = (pageX - r.left) / r.width * 320;
    const y = (pageY - r.top) / r.height * 520;
    for (const [zid, z] of Object.entries(ZONES)) {
      if (x >= z.left && x <= z.left + z.width && y >= z.top && y <= z.top + z.height) {
        return zid;
      }
    }
    return null;
  };

  const startDrag = (e, id) => {
    if (placed[id]) return;
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    const state = { id, x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY, pointerId: e.pointerId, moved: false };
    dragRef.current = state;
    setDrag(state);
  };

  const triggerSparkle = (zoneId) => {
    const z = ZONES[zoneId];
    setSparkleAt({ xPct: z.leftPct + z.widthPct / 2, yPct: z.topPct + z.heightPct / 2, id: Math.random() });
    setTimeout(() => setSparkleAt(null), 900);
  };

  const onMove = (e) => {
    const d = dragRef.current;
    if (!d) return;
    e.preventDefault();
    const moved = d.moved || Math.hypot(e.clientX - d.startX, e.clientY - d.startY) > 6;
    const next = { ...d, x: e.clientX, y: e.clientY, moved };
    dragRef.current = next;
    setDrag(next);
    const zoneId = hitTest(e.clientX, e.clientY);
    if (zoneId) {
      setHoverZone({ zone: zoneId, correct: zoneId === d.id });
    } else {
      setHoverZone(null);
    }
  };

  const endDrag = (e) => {
    const d = dragRef.current;
    if (!d) return;
    const zoneId = hitTest(e.clientX, e.clientY);
    if (zoneId && zoneId === d.id) {
      triggerSparkle(zoneId);
      onPlace(zoneId);
    } else if (!d.moved) {
      triggerSparkle(d.id);
      onPlace(d.id);
    }
    dragRef.current = null;
    setDrag(null);
    setHoverZone(null);
  };

  const placeViaClick = (id) => {
    if (placed[id]) return;
    triggerSparkle(id);
    onPlace(id);
  };

  const currentIdx = ITEMS.findIndex(i => i.id === activeItemId);
  const goPrev = () => {
    const placedItems = ITEMS.filter(i => placed[i.id]);
    if (placedItems.length === 0) return;
    const idx = placedItems.findIndex(i => i.id === activeItemId);
    const prev = placedItems[Math.max(0, idx - 1)];
    onSelectItem(prev.id);
  };
  const goNext = () => {
    const placedItems = ITEMS.filter(i => placed[i.id]);
    if (placedItems.length === 0) return;
    const idx = placedItems.findIndex(i => i.id === activeItemId);
    const next = placedItems[Math.min(placedItems.length - 1, idx + 1)];
    onSelectItem(next.id);
  };

  const draggingId = drag?.id;
  const draggingItem = draggingId ? ITEMS.find(i => i.id === draggingId) : null;

  return (
    <div className="screen-2">
      <aside className="panel">
        <h2 className="panel-title">פריטי ההלבשה</h2>
        <p className="panel-sub">לחצו על פריט (או גררו אותו) כדי להלביש</p>
        <ul className="wardrobe-list" role="list">
          {ITEMS.map(item => {
            const Ic = item.Icon;
            const isDragging = drag?.id === item.id;
            return (
              <li
                key={item.id}
                className={"wardrobe-item " + (placed[item.id] ? "placed " : "") + (isDragging ? "dragging" : "")}
                onPointerDown={e => startDrag(e, item.id)}
                onPointerMove={onMove}
                onPointerUp={endDrag}
                onPointerCancel={endDrag}
                onDoubleClick={() => placeViaClick(item.id)}
                style={{ touchAction: "none", userSelect: "none" }}
                tabIndex="0"
                onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); placeViaClick(item.id); } }}
                aria-label={`${item.label} — ${item.category}${placed[item.id] ? " (כבר הולבש)" : ""}`}
                aria-disabled={placed[item.id]}
              >
                <div className="ic"><Ic /></div>
                <div className="lbl">
                  <strong className="serif">{item.label}</strong>
                  <small>{item.category}</small>
                </div>
              </li>
            );
          })}
        </ul>
      </aside>

      <div className={"stage " + (drag ? "dragging-active" : "")}>
        <div className="character-wrap" ref={charWrapRef}>
          <CharacterBase items={placed} />
          {Object.entries(ZONES).map(([zid, z]) => {
            const isHover = hoverZone?.zone === zid;
            const correct = hoverZone?.correct;
            return (
              <div
                key={zid}
                className={"dropzone " + (isHover ? correct ? "hover" : "wrong-hover" : "")}
                style={{ top: z.topPct + "%", left: z.leftPct + "%", width: z.widthPct + "%", height: z.heightPct + "%" }}
                aria-hidden="true"
              />
            );
          })}
          {sparkleAt && (
            <div className="sparkle" key={sparkleAt.id} style={{ top: sparkleAt.yPct + "%", left: sparkleAt.xPct + "%" }}>
              {Array.from({ length: 8 }).map((_, i) => {
                const angle = i / 8 * Math.PI * 2;
                const dist = 36 + Math.random() * 12;
                return <span key={i} style={{ top: "50%", left: "50%", "--dx": Math.cos(angle) * dist + "px", "--dy": Math.sin(angle) * dist + "px", background: i % 2 === 0 ? "#D4BFA5" : "#A8B5A0", animationDelay: i * 30 + "ms" }}></span>;
              })}
            </div>
          )}
        </div>
      </div>

      {drag && draggingItem && (
        <div className="drag-ghost" style={{ left: drag.x + "px", top: drag.y + "px" }}>
          <div className="ic"><draggingItem.Icon /></div>
          <span>{draggingItem.label}</span>
        </div>
      )}

      <div className="popup-col">
        {!activeItemId ? (
          <div className="popup-empty">
            <IconShirt />
            <div className="hint serif">לחצו על פריט כדי להתחיל</div>
            <small>כל פריט חושף שכבה אחרת</small>
          </div>
        ) : (
          <>
            <ItemPopup item={ITEMS.find(i => i.id === activeItemId)} />
            <div className="nav-arrows">
              <button onClick={goPrev} disabled={currentIdx <= 0 || !placed[ITEMS[currentIdx - 1]?.id]}>→ הקודם</button>
              <button onClick={goNext} disabled={currentIdx >= ITEMS.length - 1 || !placed[ITEMS[currentIdx + 1]?.id]}>הבא ←</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function ItemPopup({ item }) {
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const timerRef = useRef(null);

  useEffect(() => {
    setPlaying(false);
    setProgress(0);
    if (timerRef.current) clearInterval(timerRef.current);
  }, [item.id]);

  const toggle = () => {
    if (playing) {
      setPlaying(false);
      clearInterval(timerRef.current);
    } else {
      setPlaying(true);
      timerRef.current = setInterval(() => {
        setProgress(p => {
          if (p >= item.audioLen) {
            clearInterval(timerRef.current);
            setPlaying(false);
            return item.audioLen;
          }
          return p + 1;
        });
      }, 1000);
    }
  };

  useEffect(() => () => clearInterval(timerRef.current), []);

  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const pct = progress / item.audioLen * 100;
  const Ic = item.Icon;

  return (
    <article className="popup" aria-live="polite">
      <div className="icon-circle" style={{ background: item.accentBg }}>
        <Ic />
      </div>
      <p className="eyebrow" style={{ color: item.accent }}>{item.category}</p>
      <h3 className="serif">{item.title}</h3>
      <div className="divider"></div>
      <p className="body">{item.body}</p>
      <div className="tags">
        {item.tags.map(t => <span key={t} className="tag">{t}</span>)}
      </div>
      <div className="audio-row">
        <button className={"audio-btn " + (playing ? "playing" : "")} onClick={toggle} aria-label={playing ? "השהה קריינות" : "הפעל קריינות"}>
          {playing
            ? <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="4" height="12" rx="1" /><rect x="9" y="2" width="4" height="12" rx="1" /></svg>
            : <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2 L13 8 L3 14 Z" /></svg>
          }
        </button>
        <div className="audio-meta">
          <div className="label">{playing ? "מספרת לכם..." : "האזינו לסיפור"}</div>
          <div className="audio-bar"><i style={{ width: pct + "%" }}></i></div>
          <div className="audio-time">{fmt(progress)} / {fmt(item.audioLen)}</div>
        </div>
      </div>
    </article>
  );
}

function EndingScreen({ tweaks, allItems, onRestart }) {
  const confetti = useMemo(() => {
    const colors = ["#A8B5A0", "#E8C5B4", "#C8A4A0", "#D4BFA5"];
    return Array.from({ length: 60 }).map((_, i) => ({
      left: Math.random() * 100,
      delay: 0.4 + Math.random() * 1.6,
      dur: 3.5 + Math.random() * 2.5,
      size: 6 + Math.random() * 6,
      color: colors[i % colors.length],
      round: Math.random() > 0.5
    }));
  }, []);

  return (
    <div className="screen-4">
      {confetti.map((c, i) => (
        <span key={i} className="confetti-piece" style={{ left: c.left + "vw", width: c.size + "px", height: c.size + "px", background: c.color, borderRadius: c.round ? "50%" : "2px", animationDelay: c.delay + "s", animationDuration: c.dur + "s" }}></span>
      ))}
      <div className="ending">
        <div className="final-char" style={{ width: "280px", height: "440px" }}>
          <CharacterBase items={allItems} />
        </div>
        <h1 className="serif">איזה כיף שהכרנו! </h1>
        <p className="sub">ועכשיו, בשביל שאני אכיר אתכם — מוזמנים ליצור איתי קשר.</p>
        <div className="contact-row">
          <a className="contact-tile" href={`https://wa.me/${tweaks.whatsapp}`} target="_blank" rel="noopener noreferrer" aria-label={`צרו קשר בוואטסאפ ${tweaks.whatsapp}`}>
            <div className="ctile-ic" style={{ background: "rgba(168,181,160,0.25)" }}><IconChat /></div>
            <div className="ctile-label">WhatsApp</div>
            <div className="ctile-detail">{tweaks.whatsapp.replace(/^972/, "0").replace(/(\d{3})(\d{3})(\d+)/, "$1-$2-$3")}</div>
            <span className="tooltip">{tweaks.whatsapp}</span>
          </a>
          <a className="contact-tile" href={`mailto:${tweaks.email}`} aria-label={`שלחו מייל ל-${tweaks.email}`}>
            <div className="ctile-ic" style={{ background: "rgba(232,197,180,0.4)" }}><IconMail /></div>
            <div className="ctile-label">Email</div>
            <div className="ctile-detail">{tweaks.email.length > 18 ? tweaks.email.slice(0, 16) + "…" : tweaks.email}</div>
            <span className="tooltip">{tweaks.email}</span>
          </a>
          <a className="contact-tile" href={`https://linkedin.com/in/${tweaks.linkedin}`} target="_blank" rel="noopener noreferrer" aria-label={`פרופיל לינקדאין ${tweaks.linkedin}`}>
            <div className="ctile-ic" style={{ background: "rgba(188,208,220,0.45)" }}><IconLink /></div>
            <div className="ctile-label">LinkedIn</div>
            <div className="ctile-detail">in/{tweaks.linkedin}</div>
            <span className="tooltip">linkedin.com/in/{tweaks.linkedin}</span>
          </a>
        </div>
        <button className="restart-btn" onClick={onRestart}>
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M2 8 a6 6 0 1 0 2-4.5 M2 2 V5 H5" /></svg>
          התחילו מחדש
        </button>
      </div>
      {tweaks.showFooterExtras && (
        <div className="footer-extras">
          <a href="#" onClick={e => e.preventDefault()}>📥 הורידו את הכרטיס כ-PDF</a>
          <a href="#" onClick={e => e.preventDefault()}>🔗 שתפו את הכרטיס</a>
        </div>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("opening");
  const [placed, setPlaced] = useState({ shirt: false, pants: false, ranks: false, shoes: false, smile: false });
  const [activeItemId, setActiveItemId] = useState(null);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const placedCount = Object.values(placed).filter(Boolean).length;
  const allItems = { shirt: true, pants: true, ranks: true, shoes: true, smile: true };

  const handlePlace = (id) => {
    setPlaced(p => {
      const next = { ...p, [id]: true };
      setActiveItemId(id);
      const count = Object.values(next).filter(Boolean).length;
      if (count === 5) {
        setTimeout(() => setScreen("ending"), 1200);
      }
      return next;
    });
  };

  const restart = () => {
    setPlaced({ shirt: false, pants: false, ranks: false, shoes: false, smile: false });
    setActiveItemId(null);
    setScreen("opening");
  };

  return (
    <div className="app paper-bg" data-screen-label={screen}>
      <Topbar placedCount={placedCount} brand={tweaks.fullName} />
      {screen === "opening" && <OpeningScreen tweaks={tweaks} onStart={() => setScreen("dressing")} />}
      {screen === "dressing" && <DressingRoom placed={placed} onPlace={handlePlace} activeItemId={activeItemId} onSelectItem={setActiveItemId} />}
      {screen === "ending" && <EndingScreen tweaks={tweaks} allItems={allItems} onRestart={restart} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
